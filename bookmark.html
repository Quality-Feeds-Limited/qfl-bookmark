<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QFL Bookmarks</title>
        <link rel="icon" href="https://qfl.com.bd/wp-content/uploads/2023/03/Q-Logo-Quality-Feed-Limited-favicon.jpg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@600&display=swap"
            rel="stylesheet">
        <style>
            :root {
                --qfl-green: #00843F;
                --qfl-green-dark: #006732;
                --qfl-accent: #4EB02A;
                --qfl-secondary: #54595F;
                --qfl-text: #7A7A7A;
                --bg: #f4f6f4;
                --surface: #ffffff;
                --surface-hover: #f1f7f1;
                --border: #e1e6e1;
                --ink: #1f2a23;
                --ink-dim: #6b736c;
                --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
                --shadow-hover: 0 6px 18px rgba(0, 132, 63, 0.14);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: var(--bg);
                color: var(--ink);
                line-height: 1.5;
                min-height: 100vh;
                padding: 0 24px 80px;
                -webkit-font-smoothing: antialiased;
            }

            header {
                position: sticky;
                top: 0;
                z-index: 10;
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border);
                margin: 0 -24px 36px;
                padding: 18px 24px;
            }

            .header-row {
                max-width: 1100px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                gap: 24px;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 14px;
                text-decoration: none;
                color: var(--ink);
                flex-shrink: 0;
            }

            .brand img {
                height: 38px;
                width: auto;
                display: block;
            }

            .brand .name {
                font-family: "Roboto Slab", serif;
                font-size: 15px;
                font-weight: 600;
                line-height: 1.1;
                color: var(--qfl-green);
            }

            .brand .sub {
                font-size: 11px;
                color: var(--ink-dim);
                letter-spacing: 0.04em;
                text-transform: uppercase;
            }

            .mainnav {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }

            .mainnav a {
                display: inline-block;
                padding: 7px 15px;
                border-radius: 20px;
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--qfl-secondary);
                text-decoration: none;
                font-size: 13px;
                font-weight: 500;
                line-height: 1.2;
                white-space: nowrap;
                transition: background .15s, color .15s, border-color .15s;
            }

            .mainnav a:hover {
                background: var(--surface-hover);
                color: var(--qfl-green);
                border-color: var(--qfl-accent);
            }

            .mainnav a.active {
                background: var(--qfl-green);
                border-color: var(--qfl-green);
                color: #fff;
            }

            .search-wrap {
                flex: 1;
                max-width: 480px;
                margin-left: auto;
                position: relative;
            }

            .search {
                width: 100%;
                padding: 11px 14px 11px 38px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
                color: var(--ink);
                font-size: 14px;
                font-family: inherit;
                outline: none;
                transition: border-color 0.15s, box-shadow 0.15s;
            }

            .search:focus {
                border-color: var(--qfl-green);
                box-shadow: 0 0 0 3px rgba(0, 132, 63, 0.12);
            }

            .search::placeholder {
                color: var(--ink-dim);
            }

            .search-icon {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                width: 16px;
                height: 16px;
                color: var(--ink-dim);
                pointer-events: none;
            }

            main {
                max-width: 1100px;
                margin: 0 auto;
            }

            section {
                margin-bottom: 48px;
            }

            section h2 {
                display: flex;
                align-items: center;
                gap: 10px;
                font-family: "Roboto Slab", serif;
                font-size: 15px;
                font-weight: 600;
                color: var(--qfl-green);
                margin-bottom: 18px;
                padding-left: 2px;
            }

            section h2::before {
                content: "";
                width: 4px;
                height: 18px;
                background: var(--qfl-accent);
                border-radius: 2px;
            }

            section h2 .count {
                font-family: "Roboto", sans-serif;
                font-size: 12px;
                font-weight: 500;
                color: var(--ink-dim);
                background: var(--surface);
                border: 1px solid var(--border);
                padding: 1px 8px;
                border-radius: 10px;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 14px;
            }

            .btn {
                display: flex;
                align-items: center;
                gap: 14px;
                min-height: 72px;
                padding: 14px 16px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                color: var(--ink);
                text-decoration: none;
                box-shadow: var(--shadow);
                transition: transform 0.12s ease, box-shadow 0.15s, border-color 0.15s, background 0.15s;
            }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-hover);
                border-color: var(--qfl-green);
                background: var(--surface-hover);
            }

            .btn:active {
                transform: translateY(0);
            }

            .icon {
                flex-shrink: 0;
                position: relative;
                width: 40px;
                height: 40px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--qfl-green);
                color: #fff;
            }

            .icon svg.fallback {
                width: 20px;
                height: 20px;
            }

            .icon img.fav {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                border-radius: 10px;
                padding: 6px;
                background: #fff;
            }

            .icon.accent {
                background: var(--qfl-accent);
            }

            .icon.secondary {
                background: var(--qfl-secondary);
            }

            .icon.orange {
                background: #FF7A1A;
            }

            .icon.blue {
                background: #1a73e8;
            }

            .icon.brand {
                background: #fff;
            }

            .icon.brand svg.fallback {
                width: 22px;
                height: 22px;
            }

            .meta {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }

            .meta .title {
                font-size: 14.5px;
                font-weight: 500;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .meta .url {
                font-size: 12px;
                color: var(--ink-dim);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .empty {
                text-align: center;
                color: var(--ink-dim);
                padding: 60px 0;
                display: none;
                font-size: 14px;
            }

            .empty.show {
                display: block;
            }

            footer {
                text-align: center;
                color: var(--ink-dim);
                font-size: 12px;
                margin-top: 40px;
                max-width: 1100px;
                margin-left: auto;
                margin-right: auto;
            }

            footer a {
                color: var(--qfl-green);
                text-decoration: none;
            }

            footer a:hover {
                text-decoration: underline;
            }

            kbd {
                background: var(--surface);
                border: 1px solid var(--border);
                border-bottom-width: 2px;
                border-radius: 4px;
                padding: 1px 6px;
                font-size: 11px;
                font-family: inherit;
                color: var(--ink);
            }

            @media (max-width: 640px) {
                body {
                    padding: 0 16px 60px;
                }

                header {
                    margin: 0 -16px 28px;
                    padding: 14px 16px;
                }

                .header-row {
                    flex-wrap: wrap;
                    gap: 14px;
                }

                .brand .name {
                    font-size: 14px;
                }

                .mainnav {
                    order: 3;
                    width: 100%;
                }

                .mainnav a {
                    flex: 1;
                    text-align: center;
                }

                .search-wrap {
                    margin-left: 0;
                    width: 100%;
                    max-width: none;
                }

                .grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>

            function host(u) {
                try { return new URL(u).hostname.replace(/^www\./, "") + (new URL(u).pathname.length > 1 ? "" : ""); }
                catch { return u; }
            }
            function prettyUrl(u) {
                try {
                    const url = new URL(u);
                    let s = url.hostname.replace(/^www\./, "");
                    if (url.pathname.length > 1) s += url.pathname.replace(/\/$/, "");
                    return s;
                } catch { return u; }
            }
            function render(filter) {
                const main = document.getElementById("main");
                const empty = document.getElementById("empty");
                main.innerHTML = "";
                let total = 0;

                links.forEach(group => {
                    const items = group.items.filter(it => {
                        if (!filter) return true;
                        const q = filter.toLowerCase();
                        return it.title.toLowerCase().includes(q)
                            || prettyUrl(it.url).toLowerCase().includes(q)
                            || group.section.toLowerCase().includes(q);
                    });
                    if (!items.length) return;
                    total += items.length;

                    const sec = document.createElement("section");
                    const h = document.createElement("h2");
                    h.innerHTML = `<span>${group.section}</span><span class="count">${items.length}</span>`;
                    sec.appendChild(h);

                    const grid = document.createElement("div");
                    grid.className = "grid";
                    items.forEach(it => {
                        const a = document.createElement("a");
                        a.className = "btn";
                        a.href = it.url;
                        a.target = "_blank";
                        a.rel = "noopener";
                        let iconHtml;
                        if (group.icon) {
                            if (group.icon.type === "img") {
                                iconHtml = `<span class="icon brand"><img class="fav" src="${group.icon.src}" alt=""></span>`;
                            } else {
                                iconHtml = `<span class="icon brand"><svg class="fallback"><use href="#${group.icon.id}"/></svg></span>`;
                            }
                        } else {
                            const tint = it.tint === "default" ? "" : it.tint;
                            iconHtml = `<span class="icon ${tint}"><svg class="fallback"><use href="#${it.icon}"/></svg></span>`;
                        }
                        a.innerHTML = iconHtml +
                            `<span class="meta"><span class="title">${it.title}</span>` +
                            `<span class="url">${prettyUrl(it.url)}</span></span>`;
                        grid.appendChild(a);
                    });
                    sec.appendChild(grid);
                    main.appendChild(sec);
                });

                empty.classList.toggle("show", total === 0);
            }

            const search = document.getElementById("search");
            search.addEventListener("input", e => render(e.target.value));

            document.addEventListener("keydown", e => {
                if (e.key === "/" && document.activeElement !== search) {
                    e.preventDefault();
                    search.focus();
                }
                if (e.key === "Escape" && document.activeElement === search) {
                    search.value = "";
                    render("");
                    search.blur();
                }
            });

            render("");
        </script>
